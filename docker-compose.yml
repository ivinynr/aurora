services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurora-app
    ports:
      - "8001:8000"
      - "5175:5175"
    volumes:
      - .:/var/www
      - ./.env.docker:/var/www/.env
      - aurora_vendor:/var/www/vendor
      - aurora_node_modules:/var/www/node_modules
    environment:
      COMPOSER_PROCESS_TIMEOUT: 0
    depends_on:
      mysql:
        condition: service_healthy
    command: bash /var/www/docker/entrypoint.sh
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: aurora-mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aurora
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - aurora_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: aurora-phpmyadmin
    ports:
      - "8101:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aurora_mysql_data:
  aurora_vendor:
  aurora_node_modules:
